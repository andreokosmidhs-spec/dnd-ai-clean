services:
  - type: web
    name: dnd-ai-backend
    runtime: python
    pythonVersion: "3.11"
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: dnd_ai_clean
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://andreokosmidhs-spec.github.io
